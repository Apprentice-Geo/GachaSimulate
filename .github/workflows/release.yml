name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME must match package version v$version"
          }

      - name: Require successful CI for release commit
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list `
            --workflow "CI" `
            --commit "$env:GITHUB_SHA" `
            --event push `
            --json databaseId,status,conclusion,headSha,createdAt,url `
            --limit 20 | ConvertFrom-Json

          $run = $runs |
            Sort-Object { [datetime]$_.createdAt } -Descending |
            Select-Object -First 1

          if (-not $run) {
            throw "No CI run found for commit $env:GITHUB_SHA."
          }

          if ($run.status -ne "completed" -or $run.conclusion -ne "success") {
            throw "Latest CI run for commit $env:GITHUB_SHA did not succeed: $($run.url)"
          }

          Write-Host "Verified successful CI: $($run.url)"
          "run_id=$($run.databaseId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download verified release assets
        uses: actions/download-artifact@v5
        with:
          name: windows-release-assets
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem 'dist/GachaSimulate Setup *.exe' | Select-Object -First 1
          $materials = Get-ChildItem "dist/*-ffmpeg-compliance.zip" | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Cannot create draft release." }
          gh release upload $env:GITHUB_REF_NAME $installer.FullName $materials.FullName "$($materials.FullName).sha256"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed; leaving draft unpublished." }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Cannot publish release." }
