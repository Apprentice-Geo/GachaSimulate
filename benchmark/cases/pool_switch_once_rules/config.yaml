schema_version: 2
items:
  - draw_count: 抽数
  - phase_token
  - target
  - filler
pools:
  - begin_pool:
      - probability: 1.0
        actions: phase_token += 1
  - second_pool:
      - probability: 0.5
        actions: target += 1
      - probability: 0.5
        actions: filler += 1
rules:
  - switch_to_second:
      mode: once
      condition:
        check: phase_token >= 3
        actions: change second_pool
initial:
  - change begin_pool
every_draw:
  - draw_count += 1
