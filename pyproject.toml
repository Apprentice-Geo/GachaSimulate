[project]
name = "gachasimulate"
version = "0.1.0"
description = "Monte Carlo Gacha Simulator"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "tqdm>=4.68.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
