[project]
name = "simulate"
version = "0.1.0"
description = "Monte Carlo Gacha Simulator"
requires-python = ">=3.12"
dependencies = [
    "attrs==26.1.0",
    "build==1.5.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "iniconfig==2.3.0",
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "kiwisolver==1.5.0",
    "matplotlib==3.10.8",
    "nodeenv==1.10.0",
    "numpy==2.4.4",
    "packaging==26.1",
    "pillow==12.2.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "pyproject-hooks==1.2.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "python-dateutil==2.9.0.post0",
    "referencing==0.37.0",
    "rpds-py==0.30.0",
    "ruff==0.15.15",
    "setuptools==80.9.0",
    "six==1.17.0",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
