[project]
name = "gachasimulate"
version = "0.1.0"
description = "Monte Carlo Gacha Simulator"
requires-python = ">=3.12"
dependencies = [
    "attrs==26.1.0",
    "build==1.5.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "iniconfig==2.3.0",
    "kiwisolver==1.5.0",
    "matplotlib==3.10.8",
    "nodeenv==1.10.0",
    "numpy==2.4.4",
    "packaging==26.1",
    "pillow==12.2.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "pyproject-hooks==1.2.0",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-benchmark==5.2.3",
    "python-dateutil==2.9.0.post0",
    "pyyaml>=6.0.3",
    "ruff==0.15.15",
    "setuptools==80.9.0",
    "six==1.17.0",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[project.scripts]
gachasimulate = "gachasimulate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"