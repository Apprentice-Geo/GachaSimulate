[package]
name = "gachasimulate-tauri"
version = "0.3.2"
edition.workspace = true
description = "GachaSimulate Tauri v2 desktop application"
license = "GPL-3.0-or-later"

[lib]
name = "gachasimulate_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gachasimulate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gachasimulate-config-store = { path = "../crates/gachasimulate-config-store" }
gachasimulate-desktop-contract.workspace = true
gachasimulate-host = { path = "../crates/gachasimulate-host" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

[dev-dependencies]
sha2.workspace = true
zip.workspace = true
