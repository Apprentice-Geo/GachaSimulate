items:
- draw_count: 抽数
- counter: 阶段计数
- reward: 阶段奖励
pools:
- early:
  - weight: 3
    actions: counter += 1
  - weight: 1
    actions: reward += 1
- late:
  - weight: 1
    actions: reward += 1
  - weight: 1
    actions: counter += 1
rules:
- switch_stage:
    mode: once
    condition:
      check: counter >= 5
      actions: change late
initial:
- change early
schema_version: 2
every_draw:
- draw_count += 1
